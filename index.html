<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PvZ Hytale Mod — Wiki Testeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">

<style>
/* ============================================================
   VARIABLES & RESET
   ============================================================ */
:root {
  --bg-deep:       #0a0d12;
  --bg-panel:      #111620;
  --bg-card:       #161c2a;
  --bg-card-hover: #1c2438;
  --border:        #1e2d47;
  --border-glow:   #2a4a7f;

  --green:         #4ade80;
  --green-dim:     #1a4030;
  --yellow:        #fbbf24;
  --yellow-dim:    #3d2e05;
  --red:           #f87171;
  --red-dim:       #3d1010;
  --blue:          #60a5fa;
  --blue-dim:      #0e2040;
  --purple:        #c084fc;
  --purple-dim:    #2a1040;
  --orange:        #fb923c;
  --orange-dim:    #3d1e05;
  --gray:          #64748b;
  --gray-dim:      #1e2533;

  --text-primary:  #e2e8f0;
  --text-secondary:#94a3b8;
  --text-muted:    #475569;

  --font-title:    'Orbitron', monospace;
  --font-body:     'Exo 2', sans-serif;

  --radius:        8px;
  --radius-lg:     14px;
  --transition:    0.2s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
  min-height: 100vh;
}

/* Scanlines texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  pointer-events: none;
  z-index: 9999;
}

a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ============================================================
   HEADER
   ============================================================ */
#site-header {
  background: linear-gradient(135deg, #0a0f1e 0%, #0d1830 50%, #0a1220 100%);
  border-bottom: 2px solid var(--border-glow);
  padding: 0 2rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 30px rgba(0,60,150,0.25);
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 2rem;
  height: 64px;
}

.site-logo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-shrink: 0;
}

.logo-icon {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--green), #16a34a);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
  box-shadow: 0 0 12px rgba(74,222,128,0.4);
}

.logo-text {
  font-family: var(--font-title);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--green);
  text-shadow: 0 0 20px rgba(74,222,128,0.5);
  line-height: 1.1;
}
.logo-sub {
  font-family: var(--font-body);
  font-size: 0.65rem;
  font-weight: 300;
  color: var(--text-muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* Search bar */
#search-wrap {
  flex: 1;
  max-width: 380px;
  position: relative;
}
#search-input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 0.5rem 1rem 0.5rem 2.8rem;
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 0.85rem;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
#search-input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
}
#search-input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute;
  left: 1rem; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 0.85rem;
  pointer-events: none;
}

/* Nav */
#main-nav {
  display: flex;
  gap: 0.25rem;
  align-items: center;
  margin-left: auto;
  flex-wrap: nowrap;
}
.nav-btn {
  background: none;
  border: 1px solid transparent;
  border-radius: var(--radius);
  color: var(--text-secondary);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  padding: 0.4rem 0.75rem;
  text-transform: uppercase;
  transition: all var(--transition);
  white-space: nowrap;
}
.nav-btn:hover, .nav-btn.active {
  background: rgba(96,165,250,0.1);
  border-color: var(--blue);
  color: var(--blue);
}

/* ============================================================
   LAYOUT
   ============================================================ */
#app {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem;
}

/* ============================================================
   HERO / INTRO
   ============================================================ */
#hero {
  background: linear-gradient(135deg, #0d1a30 0%, #0a1520 60%, #081010 100%);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius-lg);
  padding: 2.5rem 3rem;
  margin-bottom: 2.5rem;
  position: relative;
  overflow: hidden;
}
#hero::before {
  content: '📖';
  position: absolute;
  right: 2rem; top: 50%;
  transform: translateY(-50%);
  font-size: 6rem;
  opacity: 0.06;
}
.hero-tag {
  display: inline-block;
  background: var(--green-dim);
  color: var(--green);
  border: 1px solid var(--green);
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  padding: 0.25rem 0.9rem;
  text-transform: uppercase;
  margin-bottom: 1rem;
}
.hero-title {
  font-family: var(--font-title);
  font-size: clamp(1.4rem, 3vw, 2.2rem);
  font-weight: 900;
  letter-spacing: 0.05em;
  color: var(--green);
  text-shadow: 0 0 30px rgba(74,222,128,0.35);
  margin-bottom: 0.75rem;
}
.hero-desc {
  color: var(--text-secondary);
  max-width: 680px;
  font-size: 0.95rem;
}
.hero-stats {
  display: flex;
  gap: 2rem;
  margin-top: 1.5rem;
  flex-wrap: wrap;
}
.hero-stat {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.stat-value {
  font-family: var(--font-title);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--yellow);
}
.stat-label {
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* ============================================================
   SECTION TITLES
   ============================================================ */
.section-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}
.section-icon {
  font-size: 1.5rem;
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.section-title {
  font-family: var(--font-title);
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text-primary);
}
.section-subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 0.1rem;
}
.section-count {
  margin-left: auto;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 0.2rem 0.7rem;
  color: var(--text-muted);
  font-family: var(--font-title);
}

/* ============================================================
   CATEGORIES (sections wrapping)
   ============================================================ */
.wiki-section {
  margin-bottom: 3.5rem;
  animation: fadeInUp 0.4s ease both;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   CARDS GRID
   ============================================================ */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  cursor: default;
}
.card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-glow);
  box-shadow: 0 4px 20px rgba(0,60,150,0.2);
  transform: translateY(-2px);
}
.card-image-wrap {
  width: 100%;
  height: 120px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 1rem;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.card-image-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.card-image-placeholder {
  color: var(--text-muted);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}
.card-image-placeholder span { font-size: 1.5rem; opacity: 0.4; }

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 0.6rem;
}
.card-name {
  font-family: var(--font-title);
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--text-primary);
  flex: 1;
}
.card-desc {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin-bottom: 0.9rem;
}
.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-top: 0.75rem;
}
.card-field {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
  margin-bottom: 0.5rem;
}
.field-label {
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 600;
}
.field-value {
  font-size: 0.8rem;
  color: var(--text-secondary);
}

/* ============================================================
   BADGES
   ============================================================ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  border-radius: 20px;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 0.2rem 0.6rem;
  text-transform: uppercase;
  white-space: nowrap;
  border: 1px solid;
}
.badge-active      { background: var(--green-dim);  color: var(--green);  border-color: var(--green);  }
.badge-coming      { background: var(--blue-dim);   color: var(--blue);   border-color: var(--blue);   }
.badge-deprecated  { background: var(--gray-dim);   color: var(--gray);   border-color: var(--gray);   }
.badge-important   { background: var(--yellow-dim); color: var(--yellow); border-color: var(--yellow); }
.badge-tips        { background: var(--purple-dim); color: var(--purple); border-color: var(--purple); }
.badge-warning     { background: var(--red-dim);    color: var(--red);    border-color: var(--red);    }
.badge-horde       { background: var(--orange-dim); color: var(--orange); border-color: var(--orange); }

/* Type badges for plants */
.badge-attack   { background: #3d0f0f; color: #f87171; border-color: #f87171; }
.badge-economy  { background: #3d2e05; color: #fbbf24; border-color: #fbbf24; }
.badge-defense  { background: #0e2040; color: #60a5fa; border-color: #60a5fa; }
.badge-support  { background: #2a1040; color: #c084fc; border-color: #c084fc; }
.badge-utility  { background: #1a2010; color: #86efac; border-color: #86efac; }

/* ============================================================
   CALLOUT BOXES
   ============================================================ */
.callout {
  border-radius: var(--radius);
  padding: 0.9rem 1.1rem;
  margin: 1rem 0;
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  font-size: 0.85rem;
  border-left: 3px solid;
}
.callout-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 0.05rem; }
.callout-content strong { display: block; margin-bottom: 0.2rem; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; }

.callout-tip     { background: rgba(192,132,252,0.07); border-color: var(--purple); color: var(--text-secondary); }
.callout-tip strong { color: var(--purple); }
.callout-warn    { background: rgba(248,113,113,0.07); border-color: var(--red);    color: var(--text-secondary); }
.callout-warn strong { color: var(--red); }
.callout-info    { background: rgba(96,165,250,0.07);  border-color: var(--blue);   color: var(--text-secondary); }
.callout-info strong { color: var(--blue); }
.callout-coming  { background: rgba(251,191,36,0.07);  border-color: var(--yellow); color: var(--text-secondary); }
.callout-coming strong { color: var(--yellow); }

/* ============================================================
   SPECIAL SECTION: PvZ BOOK
   ============================================================ */
#section-pvzbook .book-hero {
  background: linear-gradient(135deg, #0f1f10 0%, #081a10 50%, #0a0f08 100%);
  border: 2px solid var(--green);
  border-radius: var(--radius-lg);
  padding: 2rem 2.5rem;
  margin-bottom: 1.5rem;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(74,222,128,0.1), inset 0 0 60px rgba(74,222,128,0.03);
}
#section-pvzbook .book-hero::after {
  content: '📗';
  position: absolute;
  right: 1.5rem; top: 50%;
  transform: translateY(-50%);
  font-size: 5rem;
  opacity: 0.12;
}
.book-hero-title {
  font-family: var(--font-title);
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--green);
  text-shadow: 0 0 20px rgba(74,222,128,0.4);
  margin-bottom: 0.5rem;
}
.book-hero-sub {
  color: var(--text-secondary);
  font-size: 0.9rem;
  max-width: 580px;
}
.book-features {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 0.75rem;
  margin-top: 1.25rem;
}
.book-feature {
  background: rgba(74,222,128,0.05);
  border: 1px solid rgba(74,222,128,0.2);
  border-radius: var(--radius);
  padding: 0.75rem 1rem;
  font-size: 0.82rem;
  color: var(--text-secondary);
  display: flex; align-items: center; gap: 0.5rem;
}
.book-feature em { color: var(--green); font-style: normal; font-weight: 600; }

/* ============================================================
   OVERVIEW BLOCK (for Horde, Events, etc.)
   ============================================================ */
.overview-block {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}
.overview-block h3 {
  font-family: var(--font-title);
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  color: var(--yellow);
  margin-bottom: 0.75rem;
}
.overview-block p {
  color: var(--text-secondary);
  font-size: 0.875rem;
  margin-bottom: 0.5rem;
}
.overview-steps {
  list-style: none;
  counter-reset: steps;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-top: 0.75rem;
}
.overview-steps li {
  counter-increment: steps;
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  font-size: 0.85rem;
  color: var(--text-secondary);
}
.overview-steps li::before {
  content: counter(steps);
  background: var(--yellow-dim);
  color: var(--yellow);
  border: 1px solid var(--yellow);
  border-radius: 50%;
  width: 22px; height: 22px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem;
  font-weight: 700;
  font-family: var(--font-title);
}

/* ============================================================
   FILTER BAR
   ============================================================ */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 1.2rem;
}
.filter-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-muted);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 0.3rem 0.85rem;
  text-transform: uppercase;
  transition: all var(--transition);
}
.filter-btn:hover { border-color: var(--blue); color: var(--blue); }
.filter-btn.active {
  background: var(--blue-dim);
  border-color: var(--blue);
  color: var(--blue);
}

/* ============================================================
   PROGRESS TABLE (Déblocages)
   ============================================================ */
.unlock-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}
.unlock-table th {
  background: var(--bg-panel);
  color: var(--text-muted);
  font-family: var(--font-title);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  padding: 0.6rem 1rem;
  text-align: left;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.unlock-table td {
  padding: 0.7rem 1rem;
  border-bottom: 1px solid rgba(30,45,71,0.5);
  color: var(--text-secondary);
  vertical-align: middle;
}
.unlock-table tr:hover td { background: rgba(255,255,255,0.02); }

/* ============================================================
   FOOTER
   ============================================================ */
#site-footer {
  border-top: 1px solid var(--border);
  margin-top: 4rem;
  padding: 2rem;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.78rem;
  letter-spacing: 0.06em;
}
#site-footer strong { color: var(--green); }

/* ============================================================
   SEARCH HIGHLIGHT
   ============================================================ */
.search-hidden { display: none !important; }
mark { background: rgba(251,191,36,0.25); color: var(--yellow); border-radius: 2px; padding: 0 1px; }

/* ============================================================
   SCROLLBAR
   ============================================================ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 3px; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 768px) {
  #site-header { padding: 0 1rem; }
  .header-inner { gap: 0.75rem; height: auto; padding: 0.75rem 0; flex-wrap: wrap; }
  #search-wrap { max-width: 100%; order: 3; flex: 0 0 100%; }
  #main-nav { margin-left: 0; overflow-x: auto; padding-bottom: 2px; }
  #app { padding: 1rem; }
  #hero { padding: 1.5rem; }
}
</style>
</head>
<body>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header id="site-header">
  <div class="header-inner">
    <div class="site-logo">
      <div class="logo-icon">🌱</div>
      <div>
        <div class="logo-text">PvZ HYTALE</div>
        <div class="logo-sub">Wiki Testeur — Documentation du Mod</div>
      </div>
    </div>

    <div id="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Rechercher une plante, zombie, item…" autocomplete="off">
    </div>

    <nav id="main-nav">
      <!-- Les boutons de navigation sont générés dynamiquement par JS -->
    </nav>
  </div>
</header>

<!-- ============================================================
     APPLICATION PRINCIPALE
     ============================================================ -->
<div id="app">
  <!-- Hero généré par JS -->
  <div id="hero-container"></div>
  <!-- Contenu des sections généré par JS -->
  <div id="content"></div>
</div>

<footer id="site-footer">
  <strong>PvZ Hytale Mod</strong> — Wiki Testeur &nbsp;·&nbsp; Généré dynamiquement depuis les données JS &nbsp;·&nbsp; Modifiez <code>WIKI_DATA</code> pour mettre à jour le contenu
</footer>


<script>
/* ============================================================
   ██████   ██████  ███    ██ ███    ██ ███████ ███████ ███████
   ██   ██ ██    ██ ████   ██ ████   ██ ██      ██      ██
   ██   ██ ██    ██ ██ ██  ██ ██ ██  ██ █████   █████   ███████
   ██   ██ ██    ██ ██  ██ ██ ██  ██ ██ ██      ██           ██
   ██████   ██████  ██   ████ ██   ████ ███████ ███████ ███████

   ZONE DE DONNÉES — MODIFIEZ CE BLOC POUR METTRE À JOUR LE WIKI
   ============================================================ */
const WIKI_DATA = {

  /* ----------------------------------------------------------
     MÉTA DU SITE
  ---------------------------------------------------------- */
  meta: {
    title:   "PvZ Hytale Mod — Wiki Testeur",
    tagline: "Documentation officielle du mod Plants vs Zombies pour Hytale",
    version: "0.1 — Alpha Testeurs",
    description: "Ce wiki centralise toutes les informations utiles pour tester le mod PvZ Hytale. Retrouvez ici les systèmes de hordes, les plantes, les zombies, les events, la progression et bien plus encore.",
    stats: [
      { value: "8",   label: "Catégories" },
      { value: "PvZ Book", label: "Hub central" },
      { value: "α",   label: "Version Alpha" },
      { value: "WIP", label: "En cours de dev" },
    ]
  },

  /* ----------------------------------------------------------
     SECTION : PvZ BOOK
     Élément central du mod — à mettre en avant
  ---------------------------------------------------------- */

/* ============================================================
   UTILITAIRES
   ============================================================ */

// Retourne le HTML d'un badge selon le statut
function badgeStatus(status) {
  const map = {
    active:     ['badge-active',     '● Actif'],
    coming:     ['badge-coming',     '◌ Coming Soon'],
    deprecated: ['badge-deprecated', '✕ Deprecated'],
    important:  ['badge-important',  '★ Important'],
    tips:       ['badge-tips',       '💡 Tips'],
    warning:    ['badge-warning',    '⚠ Attention'],
    horde:      ['badge-horde',      '⚔ Horde'],
  };
  const [cls, label] = map[status] || map['active'];
  return `<span class="badge ${cls}">${label}</span>`;
}

// Retourne le HTML d'un badge de type (pour plantes)
function badgeType(type) {
  const map = {
    attack:  ['badge-attack',  '⚔ Attaque'],
    economy: ['badge-economy', '☀ Économie'],
    defense: ['badge-defense', '🛡 Défense'],
    support: ['badge-support', '💜 Support'],
    utility: ['badge-utility', '🔧 Utilitaire'],
  };
  const [cls, label] = map[type] || ['badge-active', type];
  return `<span class="badge ${cls}">${label}</span>`;
}

// Retourne le HTML d'un callout
function renderCallout({ type, icon, title, text }) {
  const cls = {
    tip: 'callout-tip', warn: 'callout-warn',
    info: 'callout-info', coming: 'callout-coming', important: 'callout-info'
  }[type] || 'callout-info';
  return `<div class="callout ${cls}">
    <span class="callout-icon">${icon}</span>
    <div class="callout-content"><strong>${title}</strong>${text}</div>
  </div>`;
}

// Retourne le HTML d'une image ou d'un placeholder
function renderImage(src, alt) {
  return `<div class="card-image-wrap">${
    src
      ? `<img src="${src}" alt="${alt || ''}">`
      : `<div class="card-image-placeholder"><span>🖼</span>Image à venir</div>`
  }</div>`;
}

// Retourne le HTML d'un champ label/valeur
function renderField(label, value) {
  if (!value) return '';
  return `<div class="card-field">
    <span class="field-label">${label}</span>
    <span class="field-value">${value}</span>
  </div>`;
}

/* ============================================================
   NAVIGATION
   ============================================================ */
const NAV_SECTIONS = [
  { id: 'pvzbook',    label: WIKI_DATA.pvzbook.navLabel },
  { id: 'plantes',    label: WIKI_DATA.plantes.navLabel },
  { id: 'zombies',    label: WIKI_DATA.zombies.navLabel },
  { id: 'events',     label: WIKI_DATA.events.navLabel },
  { id: 'items',      label: WIKI_DATA.items.navLabel },
  { id: 'npc',        label: WIKI_DATA.npc.navLabel },
];

function buildNav() {
  const nav = document.getElementById('main-nav');
  NAV_SECTIONS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = s.label;
    btn.dataset.target = `section-${s.id}`;
    btn.addEventListener('click', () => {
      document.getElementById(`section-${s.id}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      nav.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
    nav.appendChild(btn);
  });
}

/* ============================================================
   FILTRES ZOMBIES
   ============================================================ */
function bindZombieFilters() {
  const bar = document.getElementById('zombie-filters');
  if (!bar) return;
  bar.addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.dataset.filter;
    document.querySelectorAll('#zombie-grid .card').forEach(card => {
      if (filter === 'Tous') { card.style.display = ''; return; }
      if (filter === 'Coming Soon') { card.style.display = card.dataset.status === 'coming' ? '' : 'none'; return; }
      card.style.display = card.dataset.context === filter ? '' : 'none';
    });
  });
}

/* ============================================================
   FILTRES ITEMS
   ============================================================ */
function bindItemFilters() {
  document.querySelectorAll('[data-item-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-item-filter]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.itemFilter;
      document.querySelectorAll('#items-grid .card').forEach(card => {
        card.style.display = (filter === 'Tous' || card.dataset.subcat === filter) ? '' : 'none';
      });
    });
  });
}

/* ============================================================
   RECHERCHE
   ============================================================ */
function bindSearch() {
  const input = document.getElementById('search-input');
  input.addEventListener('input', () => {
    const query = input.value.trim().toLowerCase();
    document.querySelectorAll('.searchable').forEach(card => {
      if (!query) { card.classList.remove('search-hidden'); return; }
      const text = card.textContent.toLowerCase();
      card.classList.toggle('search-hidden', !text.includes(query));
    });
    // Masquer les sections entièrement vides
    document.querySelectorAll('.wiki-section').forEach(section => {
      if (!query) { section.style.display = ''; return; }
      const visible = [...section.querySelectorAll('.searchable')].some(c => !c.classList.contains('search-hidden'));
      const hasOtherContent = section.querySelectorAll('.overview-block, .book-hero, .unlock-table').length > 0;
      section.style.display = (visible || hasOtherContent) ? '' : 'none';
    });
  });
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  // Hero
  document.getElementById('hero-container').innerHTML = renderHero();

  // Sections
  const content = document.getElementById('content');
  content.innerHTML = [
    renderPvzBook(),
    renderPlantes(),
    renderZombies(),
    renderEvents(),
    renderItems(),
    renderNpc(),
  ].join('');

  // Navigation
  buildNav();

  // Filtres
  bindZombieFilters();
  bindItemFilters();

  // Recherche
  bindSearch();

  // Active nav on scroll
  const sections = document.querySelectorAll('.wiki-section');
  const navBtns  = document.querySelectorAll('.nav-btn');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id.replace('section-', '');
        navBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.target === `section-${id}`);
        });
      }
    });
  }, { threshold: 0.25 });
  sections.forEach(s => observer.observe(s));
}

document.addEventListener('DOMContentLoaded', init);
</script>
